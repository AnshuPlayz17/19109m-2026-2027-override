name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src include \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  typecheck:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Parses the sources against the real PROS and LemLib headers with a host
      # compiler. No ARM toolchain needed, so this catches API mistakes on every
      # push without the fragile PROS CLI install a full build would require.
      - name: Type-check
        run: ./scripts/syntax-check.sh
